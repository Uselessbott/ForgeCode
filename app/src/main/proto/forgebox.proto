syntax = "proto3";

package forgebox.v1;

option java_package = "dev.forgebox.proto";
option java_outer_classname = "ForgeProto";
option java_multiple_files = false;
option optimize_for = LITE_RUNTIME;

// Wire contract between Kotlin and the Rust core. One Request maps to one
// Response; the id is echoed so callers can correlate concurrent calls.
message Request {
  uint32 id = 1;
  oneof kind {
    GetInfoRequest get_info = 2;
    CreateProjectRequest create_project = 3;
    ListProjectsRequest list_projects = 4;
    WriteFileRequest write_file = 5;
    ReadFileRequest read_file = 6;
    ListFilesRequest list_files = 7;
    RenameFileRequest rename_file = 8;
    DeletePathRequest delete_path = 9;
    CreateFolderRequest create_folder = 10;
    DeleteProjectRequest delete_project = 11;
    RenameProjectRequest rename_project = 12;
    StatFileRequest stat_file = 13;
    WriteFileIfUnchangedRequest write_file_if_unchanged = 14;
    ListTerminalSessionsRequest list_terminal_sessions = 15;
    RenameTerminalSessionRequest rename_terminal_session = 16;
    StopAllTerminalSessionsRequest stop_all_terminal_sessions = 17;
    EvaluateCommandRequest evaluate_command = 18;
    IssueApprovalTokenRequest issue_approval_token = 19;
    ConsumeApprovalTokenRequest consume_approval_token = 20;
    GitInitRequest git_init = 21;
    GitStatusRequest git_status = 22;
    GitDiffRequest git_diff = 23;
    GitStageRequest git_stage = 24;
    GitUnstageRequest git_unstage = 25;
    GitCommitRequest git_commit = 26;
    GitBranchListRequest git_branch_list = 27;
    GitBranchCreateRequest git_branch_create = 28;
    GitBranchSwitchRequest git_branch_switch = 29;
    GitLogRequest git_log = 30;
    GitShowRequest git_show = 31;
    GitCloneLocalRequest git_clone_local = 32;
    GitRemoteFetchRequest git_remote_fetch = 33;
    GitRemotePushRequest git_remote_push = 34;
    GitAuthStartDeviceFlowRequest git_auth_start_device_flow = 35;
    GitAuthPollRequest git_auth_poll = 36;
    GitAuthStorePatRequest git_auth_store_pat = 37;
    GitAuthRevokeRequest git_auth_revoke = 38;
    GitCredentialForRemoteRequest git_credential_for_remote = 39;
    LinuxEnvStatusRequest linux_env_status = 40;
    LinuxEnvInstallRequest linux_env_install = 41;
    LinuxEnvUninstallRequest linux_env_uninstall = 42;
    LinuxShellSpawnRequest linux_shell_spawn = 43;
    LinuxPackageInstallRequest linux_package_install = 44;
    LinuxRunInstalledBinaryRequest linux_run_installed_binary = 45;
  }
}

message Response {
  uint32 id = 1;
  Status status = 2;
  Error error = 3;
  oneof kind {
    GetInfoResponse get_info = 4;
    CreateProjectResponse create_project = 5;
    ListProjectsResponse list_projects = 6;
    WriteFileResponse write_file = 7;
    ReadFileResponse read_file = 8;
    ListFilesResponse list_files = 9;
    RenameFileResponse rename_file = 10;
    DeletePathResponse delete_path = 11;
    CreateFolderResponse create_folder = 12;
    DeleteProjectResponse delete_project = 13;
    RenameProjectResponse rename_project = 14;
    StatFileResponse stat_file = 15;
    WriteFileIfUnchangedResponse write_file_if_unchanged = 16;
    ListTerminalSessionsResponse list_terminal_sessions = 17;
    RenameTerminalSessionResponse rename_terminal_session = 18;
    StopAllTerminalSessionsResponse stop_all_terminal_sessions = 19;
    EvaluateCommandResponse evaluate_command = 20;
    IssueApprovalTokenResponse issue_approval_token = 21;
    ConsumeApprovalTokenResponse consume_approval_token = 22;
    GitInitResponse git_init = 23;
    GitStatusResponse git_status = 24;
    GitDiffResponse git_diff = 25;
    GitStageResponse git_stage = 26;
    GitUnstageResponse git_unstage = 27;
    GitCommitResponse git_commit = 28;
    GitBranchListResponse git_branch_list = 29;
    GitBranchCreateResponse git_branch_create = 30;
    GitBranchSwitchResponse git_branch_switch = 31;
    GitLogResponse git_log = 32;
    GitShowResponse git_show = 33;
    GitCloneLocalResponse git_clone_local = 34;
    GitRemoteFetchResponse git_remote_fetch = 35;
    GitRemotePushResponse git_remote_push = 36;
    GitAuthStartDeviceFlowResponse git_auth_start_device_flow = 37;
    GitAuthPollResponse git_auth_poll = 38;
    GitAuthStorePatResponse git_auth_store_pat = 39;
    GitAuthRevokeResponse git_auth_revoke = 40;
    GitCredentialForRemoteResponse git_credential_for_remote = 41;
    LinuxEnvStatusResponse linux_env_status = 42;
    LinuxEnvInstallResponse linux_env_install = 43;
    LinuxEnvUninstallResponse linux_env_uninstall = 44;
    LinuxShellSpawnResponse linux_shell_spawn = 45;
    LinuxPackageInstallResponse linux_package_install = 46;
    LinuxRunInstalledBinaryResponse linux_run_installed_binary = 47;
  }
}

enum Status {
  STATUS_UNSPECIFIED = 0;
  OK = 1;
  ERROR = 2;
}

message Error {
  string code = 1;
  string message = 2;
}

message GetInfoRequest {}

message GetInfoResponse {
  string version = 1;
  string workspace_root = 2;
  string database_path = 3;
  uint32 project_count = 4;
  string native_library_dir = 5;
  uint64 max_editable_file_bytes = 6;
}

message Project {
  string id = 1;
  string name = 2;
  string path = 3;
  int64 created_at = 4;
  uint64 storage_bytes = 5;
}

message CreateProjectRequest {
  string name = 1;
}

message CreateProjectResponse {
  Project project = 1;
}

message ListProjectsRequest {}

message ListProjectsResponse {
  repeated Project projects = 1;
}

message WriteFileRequest {
  string project_id = 1;
  string path = 2;
  bytes content = 3;
}

message WriteFileResponse {
  string path = 1;
  uint64 size = 2;
}

message ReadFileRequest {
  string project_id = 1;
  string path = 2;
}

message ReadFileResponse {
  bytes content = 1;
}

message ListFilesRequest {
  string project_id = 1;
  string path = 2;
  bool recursive = 3;
}

message FileEntry {
  string name = 1;
  string path = 2;
  bool is_dir = 3;
  uint64 size = 4;
}

message ListFilesResponse {
  repeated FileEntry entries = 1;
}

message RenameFileRequest {
  string project_id = 1;
  string old_path = 2;
  string new_path = 3;
}

message RenameFileResponse {
  string old_path = 1;
  string new_path = 2;
}

message DeletePathRequest {
  string project_id = 1;
  string path = 2;
  bool recursive = 3;
}

message DeletePathResponse {
  string path = 1;
}

message CreateFolderRequest {
  string project_id = 1;
  string path = 2;
}

message CreateFolderResponse {
  string path = 1;
}

message DeleteProjectRequest {
  string project_id = 1;
}

message DeleteProjectResponse {
  string project_id = 1;
}

message RenameProjectRequest {
  string project_id = 1;
  string new_name = 2;
}

message RenameProjectResponse {
  Project project = 1;
}

message StatFileRequest {
  string project_id = 1;
  string path = 2;
}

message StatFileResponse {
  string path = 1;
  uint64 size = 2;
  int64 mtime_millis = 3;
  bool is_text_heuristic = 4;
  bool exists = 5;
}

message WriteFileIfUnchangedRequest {
  string project_id = 1;
  string path = 2;
  bytes content = 3;
  int64 expected_mtime_millis = 4;
}

message WriteFileIfUnchangedResponse {
  string path = 1;
  uint64 size = 2;
  int64 mtime_millis = 3;
}

// Events are pushed to Kotlin by pollEvents. They are persisted to SQLite as
// well so a later audit subsystem can replay them.
message Event {
  uint64 seq = 1;
  int64 created_at = 2;
  oneof kind {
    FileChangedEvent file_changed = 3;
    LogEvent log = 4;
    TerminalOutputEvent terminal_output = 5;
    TerminalExitEvent terminal_exit = 6;
    TerminalTitleEvent terminal_title = 7;
    TerminalCwdEvent terminal_cwd = 8;
    TerminalSessionSpawnedEvent terminal_session_spawned = 9;
    TerminalSessionRenamedEvent terminal_session_renamed = 10;
    TerminalSessionStateEvent terminal_session_state = 11;
    TerminalSessionRestoreAvailableEvent terminal_session_restore_available = 12;
    LinuxEnvInstallProgressEvent linux_env_install_progress = 13;
  }
}

message FileChangedEvent {
  string project_id = 1;
  string path = 2;
  string change_type = 3;
}

message LogEvent {
  string level = 1;
  string message = 2;
}

message TerminalOutputEvent {
  uint64 pty_id = 1;
  bytes diff_bytes = 2; // UTF-8 JSON diff: {lines:[...],cursor:[r,c],rows,cols}
}

message TerminalExitEvent {
  uint64 pty_id = 1;
  int32 code = 2;
}

message TerminalTitleEvent {
  uint64 pty_id = 1;
  string title = 2;
}

message TerminalCwdEvent {
  uint64 pty_id = 1;
  string cwd = 2;
}

enum TerminalSessionState {
  TERMINAL_SESSION_STATE_UNSPECIFIED = 0;
  TERMINAL_SESSION_STARTING = 1;
  TERMINAL_SESSION_RUNNING = 2;
  TERMINAL_SESSION_EXITED = 3;
  TERMINAL_SESSION_STOPPED = 4;
  TERMINAL_SESSION_CRASHED = 5;
}

message TerminalSessionDescriptor {
  uint64 pty_id = 1;
  string name = 2;
  string cwd = 3;
  TerminalSessionState state = 4;
  int32 exit_code = 5;
  int64 created_at = 6;
  int64 last_used = 7;
  bool restorable = 8;
  bool previous_process_ended = 9;
  string env_overrides_json = 10;
}

message TerminalSessionSpawnedEvent { TerminalSessionDescriptor session = 1; }
message TerminalSessionRenamedEvent { uint64 pty_id = 1; string name = 2; }
message TerminalSessionStateEvent { uint64 pty_id = 1; TerminalSessionState state = 2; int32 exit_code = 3; }
message TerminalSessionRestoreAvailableEvent { TerminalSessionDescriptor session = 1; }

message ListTerminalSessionsRequest {}
message ListTerminalSessionsResponse { repeated TerminalSessionDescriptor sessions = 1; uint32 session_cap = 2; }
message RenameTerminalSessionRequest { uint64 pty_id = 1; string name = 2; }
message RenameTerminalSessionResponse { TerminalSessionDescriptor session = 1; }
message StopAllTerminalSessionsRequest {}
message StopAllTerminalSessionsResponse { uint32 stopped = 1; }

enum CommandOrigin {
  COMMAND_ORIGIN_UNSPECIFIED = 0;
  COMMAND_ORIGIN_USER = 1;
  COMMAND_ORIGIN_INSTALLED_BINARY = 2;
}

message EvaluateCommandRequest { string command = 1; bool actor_is_agent = 2; string session_id = 3; string cwd = 4; CommandOrigin origin = 5; }
message EvaluateCommandResponse {
  string decision = 1; // ALLOW|CONFIRM|DENY
  string reason = 2;
  string normalized_command = 3;
  repeated string argv = 4;
  string command_hash = 5;
  uint32 file_count_estimate = 6;
  bool affects_outside_project = 7;
  bool uses_network = 8;
  bool creates_checkpoint = 9;
}
message IssueApprovalTokenRequest { string command_hash = 1; string session_id = 2; }
message IssueApprovalTokenResponse { string token = 1; int64 expires_in_seconds = 2; }
message ConsumeApprovalTokenRequest { string token = 1; string command_hash = 2; string session_id = 3; }
message ConsumeApprovalTokenResponse { bool ok = 1; }

message GitInitRequest { string project_id = 1; }
message GitInitResponse { bool ok = 1; }

message GitFileStatus { string path = 1; string status = 2; bool is_binary = 3; }
message GitStatusRequest { string project_id = 1; }
message GitStatusResponse { repeated GitFileStatus staged = 1; repeated GitFileStatus unstaged = 2; repeated GitFileStatus untracked = 3; string branch = 4; }

message GitDiffRequest { string project_id = 1; string scope = 2; string path = 3; }
message GitDiffResponse { string unified_diff = 1; }

message GitStageRequest { string project_id = 1; repeated string files = 2; }
message GitStageResponse { bool ok = 1; }
message GitUnstageRequest { string project_id = 1; repeated string files = 2; }
message GitUnstageResponse { bool ok = 1; }

message GitCommitRequest { string project_id = 1; string message = 2; string author_name = 3; string author_email = 4; }
message GitCommitResponse { string commit_id = 1; }

message GitBranchListRequest { string project_id = 1; }
message GitBranchInfo { string name = 1; bool is_current = 2; }
message GitBranchListResponse { repeated GitBranchInfo branches = 1; }
message GitBranchCreateRequest { string project_id = 1; string name = 2; }
message GitBranchCreateResponse { bool ok = 1; }
message GitBranchSwitchRequest { string project_id = 1; string name = 2; }
message GitBranchSwitchResponse { bool ok = 1; }

message GitLogRequest { string project_id = 1; uint32 limit = 2; }
message GitCommitInfo { string commit_id = 1; string author = 2; string email = 3; string message = 4; int64 timestamp = 5; }
message GitLogResponse { repeated GitCommitInfo commits = 1; }
message GitShowRequest { string project_id = 1; string commit_id = 2; }
message GitShowResponse { string unified_diff = 1; }

message GitCloneLocalRequest { string source_project_id = 1; string target_project_name = 2; }
message GitCloneLocalResponse { string project_id = 1; }

message GitRemoteFetchRequest { string project_id = 1; string remote = 2; string credential_handle = 3; }
message GitRemoteFetchResponse { bool ok = 1; string message = 2; }
message GitRemotePushRequest { string project_id = 1; string remote = 2; string branch = 3; bool force = 4; string credential_handle = 5; string approval_token = 6; }
message GitRemotePushResponse { bool ok = 1; string message = 2; }

message GitAuthStartDeviceFlowRequest { string provider = 1; }
message GitAuthStartDeviceFlowResponse { string device_code = 1; string user_code = 2; string verification_uri = 3; int32 expires_in = 4; int32 interval = 5; }
message GitAuthPollRequest { string provider = 1; string device_code = 2; }
message GitAuthPollResponse { string status = 1; string token_handle = 2; string message = 3; }
message GitAuthStorePatRequest { string provider = 1; string pat = 2; }
message GitAuthStorePatResponse { string token_handle = 1; }
message GitAuthRevokeRequest { string provider = 1; }
message GitAuthRevokeResponse { bool ok = 1; }
message GitCredentialForRemoteRequest { string project_id = 1; string remote_url = 2; string operation = 3; string provider = 4; }
message GitCredentialForRemoteResponse { string credential_handle = 1; int64 expires_at = 2; }

// ==================== M10 Linux Userspace ====================

enum LinuxEnvState {
  LINUX_ENV_STATE_UNSPECIFIED = 0;
  LINUX_ENV_NOT_INSTALLED = 1;
  LINUX_ENV_INSTALLING = 2;
  LINUX_ENV_READY = 3;
  LINUX_ENV_FAILED = 4;
}

enum LinuxDistro {
  LINUX_DISTRO_UNSPECIFIED = 0;
  LINUX_DISTRO_DEBIAN = 1;
  LINUX_DISTRO_ALPINE = 2;
}

enum LinuxPackageManager {
  LINUX_PACKAGE_MANAGER_UNSPECIFIED = 0;
  LINUX_PACKAGE_MANAGER_NPM = 1;
  LINUX_PACKAGE_MANAGER_APT = 2;
  LINUX_PACKAGE_MANAGER_APK = 3;
}

enum LinuxBootstrapMode {
  LINUX_BOOTSTRAP_MODE_UNSPECIFIED = 0;
  LINUX_BOOTSTRAP_MODE_BUNDLED_OFFLINE = 1;
  LINUX_BOOTSTRAP_MODE_NETWORK_DOWNLOAD = 2;
}

message LinuxEnvStatusRequest {}

message LinuxEnvStatusResponse {
  LinuxEnvState state = 1;
  string rootfs_path = 2;
  LinuxDistro distro = 3;
  string arch = 4;
  uint64 size_bytes = 5;
  string pkg_mgr = 6;
  string message = 7;
  bool rootfs_present = 8;
  bool proot_loader_present = 9;
  string shell_binary = 10;
}

message LinuxEnvInstallRequest {
  LinuxDistro distro = 1;
  LinuxBootstrapMode bootstrap_mode = 2; // default BUNDLED_OFFLINE for M10.1
  string source_path = 3; // app-private path to bundled tar.gz copied by Kotlin
}

message LinuxEnvInstallResponse {
  LinuxEnvState state = 1;
  string progress_token = 2;
  string message = 3;
}

message LinuxEnvInstallProgressEvent {
  string progress_token = 1;
  string stage = 2;
  uint32 percent = 3;
  uint64 bytes_done = 4;
  uint64 bytes_total = 5;
  string message = 6;
  LinuxEnvState state = 7;
}

message LinuxEnvUninstallRequest {}
message LinuxEnvUninstallResponse {
  bool ok = 1;
  LinuxEnvState state = 2;
  string message = 3;
}

message LinuxShellSpawnRequest {
  string project_id = 1;
  uint32 cols = 2;
  uint32 rows = 3;
  string env_json = 4;
}

message LinuxShellSpawnResponse {
  uint64 pty_id = 1;
  LinuxEnvState env_state = 2;
}

message LinuxPackageInstallRequest {
  LinuxPackageManager manager = 1;
  string package_spec = 2;
  string cwd_project_id = 3;
}

message LinuxPackageInstallResponse {
  uint64 pty_id = 1;
  string command = 2;
}

message LinuxRunInstalledBinaryRequest {
  string project_id = 1;
  string binary_name = 2;
  string argv_json = 3;
  string approval_token = 4;
  string command_hash = 5;
  string session_id = 6;
}

message LinuxRunInstalledBinaryResponse {
  uint64 pty_id = 1;
  string command = 2;
}
