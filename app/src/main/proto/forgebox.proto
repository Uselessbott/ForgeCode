syntax = "proto3";

package forgebox.v1;

option java_package = "dev.forgebox.proto";
option java_outer_classname = "ForgeProto";
option java_multiple_files = false;
option optimize_for = LITE_RUNTIME;

// Wire contract between Kotlin and the Rust core. One Request maps to one
// Response; the id is echoed so callers can correlate concurrent calls.
message Request {
  uint32 id = 1;
  oneof kind {
    GetInfoRequest get_info = 2;
    CreateProjectRequest create_project = 3;
    ListProjectsRequest list_projects = 4;
    WriteFileRequest write_file = 5;
    ReadFileRequest read_file = 6;
    ListFilesRequest list_files = 7;
    RenameFileRequest rename_file = 8;
    DeletePathRequest delete_path = 9;
    CreateFolderRequest create_folder = 10;
    DeleteProjectRequest delete_project = 11;
    RenameProjectRequest rename_project = 12;
    StatFileRequest stat_file = 13;
    WriteFileIfUnchangedRequest write_file_if_unchanged = 14;
  }
}

message Response {
  uint32 id = 1;
  Status status = 2;
  Error error = 3;
  oneof kind {
    GetInfoResponse get_info = 4;
    CreateProjectResponse create_project = 5;
    ListProjectsResponse list_projects = 6;
    WriteFileResponse write_file = 7;
    ReadFileResponse read_file = 8;
    ListFilesResponse list_files = 9;
    RenameFileResponse rename_file = 10;
    DeletePathResponse delete_path = 11;
    CreateFolderResponse create_folder = 12;
    DeleteProjectResponse delete_project = 13;
    RenameProjectResponse rename_project = 14;
    StatFileResponse stat_file = 15;
    WriteFileIfUnchangedResponse write_file_if_unchanged = 16;
  }
}

enum Status {
  STATUS_UNSPECIFIED = 0;
  OK = 1;
  ERROR = 2;
}

message Error {
  string code = 1;
  string message = 2;
}

message GetInfoRequest {}

message GetInfoResponse {
  string version = 1;
  string workspace_root = 2;
  string database_path = 3;
  uint32 project_count = 4;
  string native_library_dir = 5;
  uint64 max_editable_file_bytes = 6;
}

message Project {
  string id = 1;
  string name = 2;
  string path = 3;
  int64 created_at = 4;
  uint64 storage_bytes = 5;
}

message CreateProjectRequest {
  string name = 1;
}

message CreateProjectResponse {
  Project project = 1;
}

message ListProjectsRequest {}

message ListProjectsResponse {
  repeated Project projects = 1;
}

message WriteFileRequest {
  string project_id = 1;
  string path = 2;
  bytes content = 3;
}

message WriteFileResponse {
  string path = 1;
  uint64 size = 2;
}

message ReadFileRequest {
  string project_id = 1;
  string path = 2;
}

message ReadFileResponse {
  bytes content = 1;
}

message ListFilesRequest {
  string project_id = 1;
  string path = 2;
  bool recursive = 3;
}

message FileEntry {
  string name = 1;
  string path = 2;
  bool is_dir = 3;
  uint64 size = 4;
}

message ListFilesResponse {
  repeated FileEntry entries = 1;
}

message RenameFileRequest {
  string project_id = 1;
  string old_path = 2;
  string new_path = 3;
}

message RenameFileResponse {
  string old_path = 1;
  string new_path = 2;
}

message DeletePathRequest {
  string project_id = 1;
  string path = 2;
  bool recursive = 3;
}

message DeletePathResponse {
  string path = 1;
}

message CreateFolderRequest {
  string project_id = 1;
  string path = 2;
}

message CreateFolderResponse {
  string path = 1;
}

message DeleteProjectRequest {
  string project_id = 1;
}

message DeleteProjectResponse {
  string project_id = 1;
}

message RenameProjectRequest {
  string project_id = 1;
  string new_name = 2;
}

message RenameProjectResponse {
  Project project = 1;
}

message StatFileRequest {
  string project_id = 1;
  string path = 2;
}

message StatFileResponse {
  string path = 1;
  uint64 size = 2;
  int64 mtime_millis = 3;
  bool is_text_heuristic = 4;
  bool exists = 5;
}

message WriteFileIfUnchangedRequest {
  string project_id = 1;
  string path = 2;
  bytes content = 3;
  int64 expected_mtime_millis = 4;
}

message WriteFileIfUnchangedResponse {
  string path = 1;
  uint64 size = 2;
  int64 mtime_millis = 3;
}

// Events are pushed to Kotlin by pollEvents. They are persisted to SQLite as
// well so a later audit subsystem can replay them.
message Event {
  uint64 seq = 1;
  int64 created_at = 2;
  oneof kind {
    FileChangedEvent file_changed = 3;
    LogEvent log = 4;
    TerminalOutputEvent terminal_output = 5;
    TerminalExitEvent terminal_exit = 6;
    TerminalTitleEvent terminal_title = 7;
    TerminalCwdEvent terminal_cwd = 8;
  }
}

message FileChangedEvent {
  string project_id = 1;
  string path = 2;
  string change_type = 3;
}

message LogEvent {
  string level = 1;
  string message = 2;
}

message TerminalOutputEvent {
  uint64 pty_id = 1;
  bytes diff_bytes = 2; // UTF-8 JSON diff: {lines:[...],cursor:[r,c],rows,cols}
}

message TerminalExitEvent {
  uint64 pty_id = 1;
  int32 code = 2;
}

message TerminalTitleEvent {
  uint64 pty_id = 1;
  string title = 2;
}

message TerminalCwdEvent {
  uint64 pty_id = 1;
  string cwd = 2;
}
