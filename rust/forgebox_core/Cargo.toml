[package]
name = "forgebox_core"
version = "0.2.0"
edition = "2021"
rust-version = "1.86"

[lib]
name = "forgebox_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = { version = "0.21", default-features = false }
libc = "0.2"
prost = "0.14"
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "2"
vte = "0.13"

[build-dependencies]
prost-build = "0.14"
protoc-bin-vendored = "3.3"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
